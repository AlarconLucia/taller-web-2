<div class="product-detail-wrapper">
  <div class="container py-5">

    <div class="card shadow-sm border-0" *ngIf="producto; else noProducto">
      <div class="card-body p-5">
        <div class="row">

          <div class="col-md-6 mb-4 mb-md-0">
            <div class="main-image-container mb-3">
              <img [src]="'assets/img/productos/' + producto.id + '.png'" class="img-fluid rounded" [alt]="producto.nombre">
            </div>
            <div class="thumbnail-gallery d-flex justify-content-start gap-2">
              <a href="#" class="thumbnail-item active">
                <img [src]="'assets/img/productos/' + producto.id + '.png'" class="img-fluid rounded">
              </a>
            </div>
          </div>

          <div class="col-md-6">
            <p class="text-muted mb-1">{{ producto.tipo_producto.tipo }}</p>
            <h1 class="h2 fw-bold mb-3">{{ producto.nombre }}</h1>
            <p class="h3 fw-light mb-4">{{ producto.precio | currency : "ARS" : "symbol-narrow" : "1.2-2" }}</p>

            <h6 class="fw-bold">Descripción</h6>
            <p class="text-muted">{{ producto.descripcion }}</p>

            <hr class="my-4">
<div class="row align-items-end">
  <div class="col-md-5">
    <h6 class="fw-bold mb-2">Cantidad</h6>
    <div class="input-group quantity-selector" style="max-width: 150px;">
      <button class="btn btn-outline-secondary" type="button" (click)="decrementarCantidad()">-</button>
      <input type="text" class="form-control text-center" [value]="cantidad" readonly>
      <button class="btn btn-outline-secondary" type="button" (click)="incrementarCantidad()">+</button>
    </div>
  </div>
  <div class="col-md-7">
    <div class="d-grid">
       <button class="btn btn-primary-solid btn-lg" (click)="agregarAlCarrito(producto)">
         <i class="fas fa-cart-plus me-2"></i>
         Agregar al Carrito
       </button>
    </div>
  </div>
</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Plantilla para cuando el producto no se encuentra -->
    <ng-template #noProducto>
      <div class="text-center py-5">
        <h2 class="h4">Producto no encontrado</h2>
        <p class="text-muted">{{ mensajeError }}</p>
      </div>
    </ng-template>

  </div>
</div>
