<div class="modal fade" id="carritoModal" tabindex="-1" aria-labelledby="carritoModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="carritoModalLabel">Carrito de Compras</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <ng-container *ngIf="items$ | async as items; else carritoVacio">
          <div *ngIf="items.length > 0; else carritoVacio">
            <ul class="list-group">
              <li *ngFor="let item of items" class="list-group-item d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                  <img [src]="'assets/img/productos/' + item.producto.id + '.png'" [alt]="item.producto.nombre" class="img-fluid rounded" style="width: 50px; height: 50px; object-fit: cover;">
                  <div class="ms-3">
                    <h6 class="my-0">{{ item.producto.nombre }}</h6>
                    <small class="text-muted">Cantidad: {{ item.cantidad }}</small>
                  </div>
                </div>
                <button (click)="eliminarDelCarrito(item.producto.id)" class="btn btn-outline-danger btn-sm">
                  <i class="fas fa-trash"></i>
                </button>
              </li>
            </ul>
          </div>
        </ng-container>

        <ng-template #carritoVacio>
          <div class="text-center">
            <p>Tu carrito está vacío.</p>
          </div>
        </ng-template>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-danger" (click)="vaciarCarrito()">Vaciar Carrito</button>
         <button type="button" class="btn btn-success" (click)="finalizarCompra()">Finalizar Compra</button>
      </div>
      <div *ngIf="mensajeExito" class="alert alert-success mt-3">{{ mensajeExito }}</div>
      <div *ngIf="mensajeError" class="alert alert-danger mt-3">{{ mensajeError }}</div>
    </div>
  </div>
</div>
